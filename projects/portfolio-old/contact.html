<section id="contact">
  <div class="contact-inner">
    <p class="section-tag light">Contact</p>
    <h2 class="section-title">Let's Work Together</h2>
    <div class="accent-line centered"></div>
    <p class="contact-desc">Have a project in mind or just want to say hello? Fill out the form below and I'll get back to you as soon as possible.</p>

    <form action="https://mail.google.com/mail/?view=cm&to=gilbertmacasling23@gmail.com" method="get" target="_blank" class="contact-form">
      <div class="form-group">
        <label for="name">YOUR NAME</label>
        <input type="text" id="name" name="name" placeholder="e.g. Juan Dela Cruz" required />
      </div>
      <div class="form-group">
        <label for="email">EMAIL ADDRESS</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="message">MESSAGE</label>
        <textarea id="message" name="message" placeholder="Tell me about your project..."></textarea>
      </div>

      <div class="contact-buttons">
        <button type="submit" class="btn-send">
          <i class="fa-solid fa-envelope"></i> Send via Gmail
        </button>
        <a href="https://www.facebook.com/gilbert.macasling.380977" target="_blank" class="btn-facebook">
          <i class="fa-brands fa-facebook"></i> Message on Facebook
        </a>
      </div>

    </form>
  </div>
</section>
